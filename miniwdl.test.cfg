# miniwdl configuration for the wdl test targets under testing/.
# testing/lraa_test_docker.mk points $(MINIWDL_RUN) at this file.

[call_cache]
put = true
get = true
# Overridden per run.  $(MINIWDL_RUN) passes MINIWDL__CALL_CACHE__DIR naming a
# subdirectory of this one, fingerprinted by the CONTENT of the test images,
# because miniwdl's cache key names the image only by the string it was given and
# the test tag moves on every rebuild.  Without that, a run after an image
# rebuild replays the previous build's task outputs and reports success.  The
# reasoning is in testing/miniwdl_call_cache_dir.sh; the regression test is
# testing/call_cache_soundness/.
#
# The value here is what a hand-run of `miniwdl run --cfg` gets, and it is NOT
# namespaced -- so a hand-run can serve itself a stale entry across an image
# rebuild.  It cannot serve one to the suite: different directory.
dir = $PWD/__miniwdl_call_cache

[download_cache]
put = true
get = true
dir = $PWD/__miniwdl_download_cache
