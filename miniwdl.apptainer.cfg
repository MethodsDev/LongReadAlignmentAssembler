# miniwdl configuration for hosts that run Apptainer/Singularity rather than
# Docker, which is the case on internal servers where Docker is not permitted.
#
#     cd testing/sep_contigs
#     make test_wdls MINIWDL_CFG=../../miniwdl.apptainer.cfg
#
# The path is relative to the directory make runs in, so a test directory one
# level deeper needs ../../../ instead. An absolute path always works.
#
# Everything the workflows themselves need to run under Apptainer is in the WDLs
# already; see the tar --no-same-owner and archive-naming notes in
# WDL/subwdls/LRAA-build_sparse_matrices_from_tracking.wdl. This file only
# selects the backend and gives it somewhere to keep converted images.

[scheduler]
# docker_swarm (miniwdl's default), singularity, podman, udocker.
# "singularity" is the Apptainer backend too: Apptainer ships a singularity
# alias, and miniwdl drives it through the same CLI.
container_backend = singularity

[singularity]
# Left at miniwdl's default of ["singularity"], which an Apptainer install
# provides. Set to ["apptainer"] on a host that ships only the new name.
# exe = ["apptainer"]
#
# run_options is also left at miniwdl's default, which is
#     ["--containall", "--no-mount", "hostfs", "--fakeroot"]
# --fakeroot is what makes a task's writes appear to be root-owned inside the
# container, and it is the reason the WDLs pass tar --no-same-owner: restoring
# an archive's recorded uid 0 / gid 65534 fails under it. Sites that do not
# permit fakeroot will need to drop it here and may then hit different
# ownership behaviour on extraction.
#
# Converting an OCI image to a SIF is slow and happens per task without this.
# The directory is created if absent and is safe to share between runs.
#
# Keyed on the image reference, so it has the same weakness as the call cache
# below: docker://...:testing is a moving tag, and a rebuild or re-push under it
# does not invalidate the converted SIF. Delete this directory after one.
image_cache = $PWD/__miniwdl_image_cache

[call_cache]
put = true
get = true
# $(MINIWDL_RUN) overrides this with MINIWDL__CALL_CACHE__DIR, naming a
# subdirectory fingerprinted by the content of the test images -- see
# testing/miniwdl_call_cache_dir.sh. With no docker CLI there is no local image
# whose content can be read, so that fingerprint degrades to the commit and says
# so on stderr: a rebuild at one commit will not invalidate cached outputs here.
dir = $PWD/__miniwdl_call_cache

[download_cache]
put = true
get = true
dir = $PWD/__miniwdl_download_cache
